<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Gastos</title><style>*{box-sizing:border-box}body{margin:0;background:#E6E9EE;color:#2A3547;font:16px system-ui}main{max-width:1000px;margin:auto;padding:16px}h1{margin:0}button,input{font:inherit;padding:10px;border:0;border-radius:10px}button{background:#2A3547;color:white;cursor:pointer}nav,.line{display:flex;justify-content:space-between;align-items:center;gap:8px}nav{margin:20px 0}.summary,.tile{background:#2A3547;color:white;border-radius:20px;padding:18px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.money{display:block;font-size:clamp(16px,3vw,28px);font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.light,.ledger{background:#f5f6f8;color:#2A3547}.ledger{padding:16px;border-radius:18px}.bar{height:8px;background:#aeb7c5;border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#F0284A}.entry{padding:12px 0;border-bottom:1px solid #d9dfe7}.red{color:#F0284A}small{opacity:.85}h2{font-size:18px;margin:0}@media(max-width:550px){.ledgers{grid-template-columns:1fr}.tile,.summary{padding:12px}}</style><main><h1>Controle de Gastos</h1><small>Mercado · iFood · Farmácia · Transporte</small><nav><button id="prev">‹</button><strong id="month"></strong><button id="next">›</button></nav><div id="summary" class="summary"></div><div id="cards" class="grid"></div><div id="ledgers" class="grid ledgers"></div><button id="sync">Atualizar dados do GitHub</button> <button id="local">Importar JSON</button><input id="file" type="file" accept=".json" hidden><p id="status" role="status"></p></main><script>
const $=id=>document.getElementById(id),cats=['Mercado','iFood','Farmácia','Transporte'],fmt=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sum=a=>a.reduce((s,x)=>s+x.valor,0);let data=null,m='2026-12',token='';
function render(){if(!data)return;let b=data.meses[m]||data.orcamento,rows=data.lancamentos.filter(x=>x.data.startsWith(m)),budget=cats.reduce((s,c)=>s+b[c],0),actual=sum(rows);$('month').textContent=new Date(m+'-01T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});$('summary').innerHTML=[['Orçamento',budget],['Realizado',actual],['Saldo',budget-actual]].map(([k,v])=>'<div><small>'+k+'</small><span class="money">'+fmt(v)+'</span></div>').join('');$('cards').innerHTML=cats.map((c,i)=>{let a=sum(rows.filter(x=>x.categoria===c)),p=b[c]?Math.round(a/b[c]*100):a?100:0;return '<section class="tile '+(i===1||i===2?'light':'')+'"><div class="line"><h2>'+c+'</h2><b>'+p+'%</b></div><span class="money">'+fmt(a)+'</span><small>Orçamento: '+fmt(b[c])+'</small><div class="bar"><i style="width:'+Math.min(100,p)+'%;background:'+(p>=80?'#F0284A':'#8795a9')+'"></i></div><small>Saldo: '+fmt(b[c]-a)+'</small></section>'}).join('');$('ledgers').innerHTML=cats.map(c=>{let a=rows.filter(x=>x.categoria===c).sort((a,b)=>b.data.localeCompare(a.data));return '<section class="ledger"><div class="line"><h2>'+c+'</h2><b>'+fmt(sum(a))+'</b></div>'+(a.length?a.map(x=>'<div class="entry line"><small>'+esc(x.data.slice(8))+'/'+esc(x.data.slice(5,7))+'</small><div style="flex:1"><strong>'+esc(x.local)+'</strong><div><small>'+esc(x.descricao)+'</small></div></div><b class="red">'+fmt(x.valor)+'</b></div>').join(''):'<p>Nenhum lançamento.</p>')+'</section>'}).join('')}
function move(n){let d=new Date(m+'-01T12:00:00');d.setMonth(d.getMonth()+n);let next=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(next>='2026-12'){m=next;render()}}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
function load(d){if(!d||!d.meses||!cats.every(c=>Number.isFinite(d.orcamento?.[c]))||!Array.isArray(d.lancamentos))throw Error('Base inválida');data=d;render()}
async function sync(){try{if(!token)token=prompt('Token GitHub com acesso somente de leitura ao repositório (não será salvo)')||'';if(!token)return;let r=await fetch('https://api.github.com/repos/Pvboni/controle-gastos/contents/gastos.json',{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(!r.ok)throw Error('GitHub: '+r.status);load(await r.json());$('status').textContent='Dados atualizados do GitHub.'}catch(e){token='';$('status').textContent=e.message}}$('sync').onclick=sync;$('local').onclick=()=>$('file').click();$('file').onchange=async e=>{try{load(JSON.parse(await e.target.files[0].text()));$('status').textContent='Base importada.'}catch(e){$('status').textContent='Falha na importação.'}};$('month').textContent='Dezembro de 2026';$('status').textContent='Atualize do GitHub ou importe a base para começar.';
</script></html>
