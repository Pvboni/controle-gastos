<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Gastos</title><style>*{box-sizing:border-box}body{margin:0;background:#E6E9EE;color:#2A3547;font:16px system-ui}main{max-width:1000px;margin:auto;padding:16px}h1{margin:0}button,input{font:inherit;padding:10px;border:0;border-radius:10px}button{background:#2A3547;color:white;cursor:pointer}nav,.line{display:flex;justify-content:space-between;align-items:center;gap:8px}nav{margin:20px 0}.summary,.tile{background:#2A3547;color:white;border-radius:20px;padding:18px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.money{display:block;font-size:clamp(16px,3vw,28px);font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.light,.ledger{background:#f5f6f8;color:#2A3547}.ledger{padding:16px;border-radius:18px}.bar{height:8px;background:#aeb7c5;border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#F0284A}.entry{padding:12px 0;border-bottom:1px solid #d9dfe7}.red{color:#F0284A}small{opacity:.85}h2{font-size:18px;margin:0}@media(max-width:550px){.ledgers{grid-template-columns:1fr}.tile,.summary{padding:12px}} 
:root{--ice:#E6E9EE;--slate:#2A3547;--pink:#F0284A;--paper:#f5f6f8}
body{font-family:system-ui,-apple-system,sans-serif;line-height:1.45}main{padding:24px 18px 32px}h1{font-size:clamp(25px,5.5vw,36px);font-weight:750;letter-spacing:-1.2px}main>small{display:block;margin-top:4px;font-size:12px;letter-spacing:.3px}nav{margin:22px 0 16px}nav strong{text-transform:capitalize;font-size:16px}button{min-height:44px;font-weight:650}nav button{width:44px;font-size:22px;padding:0}.summary{border-radius:18px;padding:18px 14px;gap:8px;box-shadow:0 4px 14px #2a354715}.summary small{font-size:11px}.summary .money{font-size:clamp(13px,3.7vw,24px);letter-spacing:-.6px;font-variant-numeric:tabular-nums}.summary>div:nth-child(2) .money{color:#ff7790}.summary>div+div{border-left:1px solid #ffffff26;padding-left:8px}.grid{gap:12px;margin:14px 0}.tile,.tile.light{background:var(--slate);color:white;border-radius:18px;padding:16px 14px;box-shadow:0 3px 9px #2a354712}.tile h2{font-size:15px;font-weight:650}.tile .line>b{background:#ffffff16;border-radius:20px;padding:3px 7px;font-size:12px;font-variant-numeric:tabular-nums}.tile .money{font-size:clamp(18px,4.5vw,28px);margin:8px 0 3px;letter-spacing:-.5px}.tile small{font-size:11px;opacity:.85}.bar{background:#ffffff25;height:7px;margin:14px 0 10px}.bar i{background:var(--pink)!important;border-radius:8px}.ledger{border:1px solid #d6dce4;border-radius:16px;padding:16px;background:var(--paper)}.ledger h2{font-size:16px;font-weight:750}.ledger>.line{padding-bottom:8px;border-bottom:1px solid #d6dce4}.ledger>.line>b{font-size:15px}.entry{font-size:13px;gap:10px}.entry:last-child{border-bottom:0;padding-bottom:0}.entry .red{color:#c51c3b;font-variant-numeric:tabular-nums}.ledger p{font-size:13px;color:#596579;margin:14px 0 0}#sync{background:var(--pink);color:#182231;margin:8px 0;font-size:13px;padding:12px 15px}#local{background:transparent;color:var(--slate);border:1px solid #aeb7c5;font-size:13px}#status{font-size:12px;color:#596579}button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}@media(max-width:380px){main{padding:18px 12px}.tile{padding:12px 10px}.summary{padding:14px 10px}.tile h2{font-size:13px}.entry{gap:6px}}@media(min-width:700px){main{padding:36px}.tile{padding:22px}.tile small{font-size:13px}.summary small{font-size:14px}}
#editBudget{width:100%;background:transparent;color:var(--slate);border:1px solid #aeb7c5;margin-top:10px;font-size:13px}.trash{background:transparent;color:#c51c3b;padding:6px;min-width:36px}.trash svg{width:19px;height:19px}dialog{border:0;border-radius:18px;padding:22px;width:min(92vw,420px);color:var(--slate);background:var(--paper)}dialog::backdrop{background:#2a354799}dialog label{display:block;margin:12px 0;font-size:13px}dialog input{display:block;width:100%;border:1px solid #aeb7c5;margin-top:4px;background:white}dialog .line{margin-top:18px}dialog button{flex:1}.trash{color:#788394;background:transparent;min-width:28px;width:28px;min-height:44px;padding:0;font-size:18px;font-weight:400;opacity:.75}.trash:hover,.trash:focus-visible{color:#F0284A;opacity:1}.trash span{pointer-events:none}</style><main><h1>Controle de Gastos</h1><small>PLANEJAMENTO FINANCEIRO MENSAL · V1.5</small><nav><button id="prev">‹</button><strong id="month"></strong><button id="next">›</button></nav><div id="summary" class="summary"></div><button id="editBudget">Editar orçamento do mês</button><div id="cards" class="grid"></div><h2 style="margin:24px 0 8px;font-size:17px;letter-spacing:-.3px">Lançamentos por categoria</h2><div id="ledgers" class="grid ledgers"></div><button id="sync">Atualizar dados do GitHub</button> <button id="local">Importar JSON</button><input id="file" type="file" accept=".json" hidden><p id="status" role="status"></p><button id="disconnect" style="background:transparent;color:#596579;font-size:12px;padding:8px">Desconectar autorização GitHub</button><dialog id="budgetDialog"><form id="budgetForm"><h2>Editar orçamento</h2><p id="budgetMonth"></p><div id="budgetFields"></div><div class="line"><button type="button" id="cancelBudget">Cancelar</button><button type="submit">Salvar</button></div></form></dialog><dialog id="authDialog"><form id="authForm"><h2>Autorizar gravação</h2><p>Token fine-grained exclusivo deste repositório: Contents Read and write. Será armazenado neste navegador até você desconectar ou o token expirar.</p><label>Token<input id="writeToken" type="password" autocomplete="off" required></label><div class="line"><button type="button" id="cancelAuth">Cancelar</button><button type="submit">Autorizar</button></div></form></dialog></main><script>
const $=id=>document.getElementById(id),cats=['Mercado','iFood','Farmácia','Transporte'],fmt=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sum=a=>a.reduce((s,x)=>s+x.valor,0);let data=null,m='2026-12';
function render(){if(!data)return;let b=data.meses[m]||data.orcamento,rows=data.lancamentos.filter(x=>x.data.startsWith(m)),budget=cats.reduce((s,c)=>s+b[c],0),actual=sum(rows);$('month').textContent=new Date(m+'-01T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});$('summary').innerHTML=[['Orçamento',budget],['Realizado',actual],['Saldo',budget-actual]].map(([k,v])=>'<div><small>'+k+'</small><span class="money">'+fmt(v)+'</span></div>').join('');$('cards').innerHTML=cats.map((c,i)=>{let a=sum(rows.filter(x=>x.categoria===c)),p=b[c]?Math.round(a/b[c]*100):a?100:0;return '<section class="tile '+(i===1||i===2?'light':'')+'"><div class="line"><h2>'+c+'</h2><b>'+p+'%</b></div><span class="money">'+fmt(a)+'</span><small>Orçamento: '+fmt(b[c])+'</small><div class="bar"><i style="width:'+Math.min(100,p)+'%;background:'+(p>=80?'#F0284A':'#8795a9')+'"></i></div><small>Saldo: '+fmt(b[c]-a)+'</small></section>'}).join('');$('ledgers').innerHTML=cats.map(c=>{let a=rows.filter(x=>x.categoria===c).sort((a,b)=>b.data.localeCompare(a.data));return '<section class="ledger"><div class="line"><h2>'+c+'</h2><b>'+fmt(sum(a))+'</b></div>'+(a.length?a.map(x=>'<div class="entry line"><small>'+esc(x.data.slice(8))+'/'+esc(x.data.slice(5,7))+'</small><div style="flex:1"><strong>'+esc(x.local)+'</strong><div><small>'+esc(x.descricao)+'</small></div></div><b class="red">'+fmt(x.valor)+'</b><button class="trash" data-delete="'+data.lancamentos.indexOf(x)+'" aria-label="Excluir lançamento"><span aria-hidden="true">×</span></button></div>').join(''):'<p>Nenhum lançamento.</p>')+'</section>'}).join('')}
function move(n){let d=new Date(m+'-01T12:00:00');d.setMonth(d.getMonth()+n);let next=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(next>='2026-12'){m=next;render()}}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
function load(d){if(!d||!d.meses||!cats.every(c=>Number.isFinite(d.orcamento?.[c]))||!Array.isArray(d.lancamentos))throw Error('Base inválida');data=d;render()}
let syncing=false,lastSync=0;
async function sync(){if(busy||syncing)return;syncing=true;$('status').textContent='Consultando versão mais recente no GitHub...';try{const url='https://api.github.com/repos/Pvboni/controle-gastos/contents/gastos.json?ref=main&_='+Date.now();let headers={Accept:'application/vnd.github+json'};if(writeToken)headers.Authorization='Bearer '+writeToken;let r=await fetch(url,{headers,cache:'no-store'});if(writeToken&&(r.status===401||r.status===403)){r=await fetch(url,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'})}if(!r.ok)throw Error('HTTP '+r.status);let file=await r.json();let latest=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(file.content.replace(/\s/g,'')),c=>c.charCodeAt(0))));if(!busy){load(latest);lastSync=Date.now();$('status').textContent='Sincronizado com GitHub às '+new Date().toLocaleTimeString('pt-BR')+' · '+file.sha.slice(0,7)}}catch(e){$('status').textContent='Não foi possível confirmar a versão atual: '+e.message+' — dados anteriores podem estar desatualizados.'}finally{syncing=false}}$('sync').onclick=sync;$('local').onclick=()=>$('file').click();$('file').onchange=async e=>{try{load(JSON.parse(await e.target.files[0].text()));$('status').textContent='Base importada.'}catch(e){$('status').textContent='Falha na importação.'}};$('month').textContent='Dezembro de 2026';
const tokenKey='controle-gastos.github.token.v1';let writeToken='';try{writeToken=localStorage.getItem(tokenKey)||''}catch(e){}let pendingAuth=null,busy=false,editMonth='';
$('cancelAuth').onclick=()=>{$('authDialog').close();if(pendingAuth)pendingAuth(null);pendingAuth=null};$('authDialog').addEventListener('cancel',e=>{e.preventDefault();$('cancelAuth').click()});$('authForm').onsubmit=e=>{e.preventDefault();writeToken=$('writeToken').value.trim();$('writeToken').value='';$('authDialog').close();if(pendingAuth)pendingAuth(writeToken);pendingAuth=null};
async function mutate(change){if(busy||syncing){alert('Aguarde a sincronização e tente novamente.');return;}busy=true;try{if(!writeToken){let t=await new Promise(resolve=>{pendingAuth=resolve;$('authDialog').showModal()});if(!t)return}const url='https://api.github.com/repos/Pvboni/controle-gastos/contents/gastos.json',headers={Authorization:'Bearer '+writeToken,Accept:'application/vnd.github+json','Content-Type':'application/json'};$('status').textContent='Salvando no GitHub...';let response=await fetch(url,{headers,cache:'no-store'});if(!response.ok){let err=await response.json().catch(()=>({}));throw Error('Leitura GitHub: '+response.status+' — '+(err.message||response.statusText))}let file=await response.json(),latest=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(file.content.replace(/\s/g,'')),c=>c.charCodeAt(0))));change(latest);let bytes=new TextEncoder().encode(JSON.stringify(latest,null,2)),binary='';for(let byte of bytes)binary+=String.fromCharCode(byte);response=await fetch(url,{method:'PUT',headers,body:JSON.stringify({message:'Atualizar controle de gastos pelo aplicativo',content:btoa(binary),sha:file.sha,branch:'main'})});if(!response.ok){let err=await response.json().catch(()=>({}));throw Error('Gravação GitHub: '+response.status+' — '+(err.message||response.statusText))}try{localStorage.setItem(tokenKey,writeToken)}catch(e){}load(latest);$('status').textContent='Alteração salva no GitHub.';alert('Alteração salva no GitHub.')}catch(e){if(/401|403/.test(e.message)){writeToken='';try{localStorage.removeItem(tokenKey)}catch(e){}}$('status').textContent=e.message;alert(e.message)}finally{busy=false}}
$('editBudget').onclick=()=>{if(!data||busy)return;editMonth=m;$('budgetMonth').textContent=$('month').textContent;let b=data.meses[m]||data.orcamento;$('budgetFields').innerHTML=cats.map((c,i)=>'<label>'+c+'<input id="budget'+i+'" type="number" min="0" step="0.01" required value="'+b[c]+'"></label>').join('');$('budgetDialog').showModal()};$('cancelBudget').onclick=()=>$('budgetDialog').close();$('budgetForm').onsubmit=e=>{e.preventDefault();let month=editMonth,values=Object.fromEntries(cats.map((c,i)=>[c,Number($('budget'+i).value)]));$('budgetDialog').close();mutate(d=>{d.meses[month]=values})};
$('ledgers').addEventListener('click',e=>{let btn=e.target.closest('[data-delete]');if(!btn||busy||!data)return;let x=data.lancamentos[Number(btn.dataset.delete)];if(!x||!confirm('Excluir '+x.local+' — '+fmt(x.valor)+'?'))return;let signature=JSON.stringify(x),count=data.lancamentos.filter(y=>JSON.stringify(y)===signature).length;mutate(d=>{let matches=d.lancamentos.map((y,i)=>JSON.stringify(y)===signature?i:-1).filter(i=>i>=0);if(matches.length!==count||!matches.length)throw Error('Lançamento alterado. Atualize a base e tente novamente.');d.lancamentos.splice(matches[0],1)})});$('disconnect').onclick=()=>{if(busy)return;writeToken='';try{localStorage.removeItem(tokenKey)}catch(e){}$('status').textContent='Autorização removida deste navegador.'};window.addEventListener('pageshow',()=>{if(Date.now()-lastSync>3000)sync()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastSync>3000)sync()});window.addEventListener('online',sync);sync();
</script></html>
